name: Release

# Builds a signed AAB for Play and an APK for sideloading.
#
# The very first AAB has to be uploaded manually through the Play Console — the
# Publishing API cannot create a new app, only push to one that already exists.
# Once the listing exists, add a service-account secret and uncomment the upload
# step below.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# The default GITHUB_TOKEN is read-only here, so the tag build could compile and
# sign an APK and then 403 on the one step that publishes it. Releases need
# contents: write.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4

      # Never ship a red build.
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > scanrift-release.jks

      - name: Build release bundle and APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew bundleRelease assembleRelease

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: scanrift-release
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/apk/release/app-release.apk

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true

      # - name: Upload to Play internal track
      #   uses: r0adkll/upload-google-play@v1
      #   with:
      #     serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
