name: Release

# Builds a signed AAB for Play and an APK for sideloading on every merge to main, and
# publishes both on the GitHub release for the current versionName (v1.4.0 …), replacing
# the files of the previous build of that version.
#
# The very first AAB has to be uploaded manually through the Play Console — the
# Publishing API cannot create a new app, only push to one that already exists.
# Once the listing exists, add a service-account secret and uncomment the upload
# step below.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# The default GITHUB_TOKEN is read-only here, so the tag build could compile and
# sign an APK and then 403 on the one step that publishes it. Releases need
# contents: write.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4

      # Never ship a red build.
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      # Every build of main gets a fresh, increasing versionCode so Play accepts it.
      - name: Set version
        run: |
          echo "VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -1)" >> "$GITHUB_ENV"

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > scanrift-release.jks

      - name: Build release bundle and APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew bundleRelease assembleRelease

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: scanrift-release
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/apk/release/app-release.apk

      - name: Publish on the GitHub release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${VERSION_NAME}"
          dir=dist && mkdir -p "$dir"
          cp app/build/outputs/bundle/release/app-release.aab "$dir/scanrift-${VERSION_NAME}-${VERSION_CODE}.aab"
          cp app/build/outputs/apk/release/app-release.apk "$dir/scanrift-${VERSION_NAME}-${VERSION_CODE}.apk"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --title "ScanRift ${VERSION_NAME}" --generate-notes
          fi
          # Keep only this build's files on the release: drop the previous build's.
          gh release view "$tag" --json assets -q '.assets[].name' | grep -E '^scanrift-.*\.(aab|apk)$' | while read -r old; do
            gh release delete-asset "$tag" "$old" --yes
          done
          gh release upload "$tag" "$dir"/* --clobber
          echo "Published ${VERSION_NAME} (${VERSION_CODE}) on $tag" >> "$GITHUB_STEP_SUMMARY"

      # - name: Upload to Play internal track
      #   uses: r0adkll/upload-google-play@v1
      #   with:
      #     serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
      #     packageName: com.scanrift.android
      #     releaseFiles: app/build/outputs/bundle/release/app-release.aab
      #     track: internal
